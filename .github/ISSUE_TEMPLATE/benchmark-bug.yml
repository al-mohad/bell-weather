name: Benchmark bug
description: A task is impossible, ambiguous, or the scripted ceiling cannot pass it
labels: [benchmark-bug]
body:
  - type: markdown
    attributes:
      value: |
        A task the `scripted` baseline cannot pass is a bug in the benchmark, not a
        hard task. Please attach the trial directory — `meta.json`, `trace.jsonl` and
        the frames reproduce it exactly.
  - type: input
    id: task
    attributes: { label: Task id, placeholder: sim-po-01 }
    validations: { required: true }
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: bellwether run --driver sim --agent scripted --k 5 --seed 20260902
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What should have happened, and what did
      description: Include the verifier's reason string from verdict.json.
    validations: { required: true }
  - type: textarea
    id: artifacts
    attributes: { label: Trial directory or trace excerpt }
