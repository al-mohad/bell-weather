name: ci

on:
  pull_request:
  push:
    branches: [main]

# One run per ref. A superseded run is cancelled rather than left burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nothing in this workflow may reach a metered API. The whole suite runs on the
  # simulator, so a pull request from a fork is safe by construction.
  BELLWETHER_BUDGET_USD: '0'

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  benchmark:
    name: benchmark (simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Every verifier must be able to fail
        run: pnpm verify:verifiers

      - name: Calibration ceiling
        run: |
          pnpm bench:sim
          pnpm tsx scripts/assert-ceiling.ts .bellwether/sim/results.json

      - name: Reliability curve
        run: pnpm bench:curve

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: bellwether-report
          path: |
            .bellwether/sim/results.json
            .bellwether/sim/index.html
            .bellwether/curve/results.json
            .bellwether/curve/index.html
          retention-days: 14

  python-agent:
    name: reference agent (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Standard library only: no pip install, no anthropic SDK, no API key. The
      # scripted transport is what makes that possible.
      - name: Unit tests
        working-directory: agents/claude-cua
        run: python3 -m unittest discover -s tests -v

      - name: The whole agent, through the real harness, offline
        run: |
          pnpm tsx packages/cli/src/bin.ts run \
            --driver sim --agent claude-cua-scripted \
            --tasks sim-cust-01 --k 3 --seed 20260902 \
            --out .bellwether/cua-scripted
          pnpm tsx scripts/assert-ceiling.ts .bellwether/cua-scripted/results.json

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks is invoked directly rather than through its action, which scans the
      # commit range `<first pushed commit>^..<head>`. On a repository's initial push
      # the first commit is the root and has no parent, so the range is invalid, git
      # errors, and the job fails having scanned nothing - the worst possible outcome
      # for a secret scan. A full-history scan has no such edge and this repository is
      # small enough that it costs seconds.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
