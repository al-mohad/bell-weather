# Odoo 18 + Postgres, seeded for odoo-po-01.
#
# VERIFICATION STATUS: never executed. This recipe has not been run inside a Solari
# sandbox. Treat it as a starting point, not a working environment, until
# docs/methodology.md records a seeded snapshot.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odoo']
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db:/var/lib/postgresql/data

  odoo:
    image: odoo:18
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      # The sandbox exposes this through sbx.previewUrl(8069).
      - '8069:8069'
    command: >
      odoo --database=odoo --init=purchase,stock
           --db_host=db --db_user=odoo --db_password=odoo
           --without-demo=all --http-port=8069
    volumes:
      - odoo:/var/lib/odoo

volumes:
  db:
  odoo:
