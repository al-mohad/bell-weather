name: nightly-bench

# The only workflow that spends money. It never runs on a pull request, only on the
# default branch or by hand, and it runs in a protected environment so a fork cannot
# reach the credentials. See docs/threat-model.md, T7.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      agent:
        description: Agent from agents/registry.json
        default: claude-cua
      k:
        description: Attempts per task
        default: '5'
      budgetUsd:
        description: Hard ceiling for the whole run
        default: '20'

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: nightly-bench
  cancel-in-progress: false

jobs:
  live:
    if: github.repository_owner != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: live-benchmark
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run the live suite under a hard budget
        env:
          SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BELLWETHER_BUDGET_USD: ${{ inputs.budgetUsd || '20' }}
        run: |
          pnpm tsx packages/cli/src/bin.ts run \
            --driver live \
            --agent "${{ inputs.agent || 'claude-cua' }}" \
            --k "${{ inputs.k || '5' }}" \
            --budget-usd "${{ inputs.budgetUsd || '20' }}" \
            --vm-usd-per-minute "${{ vars.SOLARI_VM_USD_PER_MINUTE || '0' }}" \
            --record .bellwether/nightly/cassette.jsonl \
            --out .bellwether/nightly

      - name: Keep the cassette so this run becomes a CI regression test
        uses: actions/upload-artifact@v4
        with:
          name: nightly-cassette
          path: .bellwether/nightly/cassette.jsonl
          retention-days: 90

      - name: Publish the report
        uses: actions/upload-pages-artifact@v3
        with:
          path: .bellwether/nightly

  publish:
    needs: live
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
